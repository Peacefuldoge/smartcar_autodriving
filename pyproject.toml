[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcar-autonomous-driving"
version = "0.3.1"
description = "ROS1 autonomous smart-car with GPS/battery telemetry, UDP fleet coordination, delivery missions and CascadeClassifier face verification."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
  "numpy",
  "opencv-python",
  "Pillow",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
hardware = ["pyserial>=3.5"]

[project.scripts]
smartcar = "smartcar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

